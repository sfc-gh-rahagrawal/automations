name: COLES_RETAIL_SEMANTIC_MODEL
description: "Coles Retail Analytics - sales, reviews, sentiment, store operations, and supply chain alerts."
tables:
  - name: INVENTORY_ALERTS
    description: Inventory alerts for stock issues across stores.
    base_table:
      database: COLES_RETAIL_DB
      schema: SUPPLY_CHAIN
      table: FACT_INVENTORY_ALERTS
    primary_key:
      columns:
        - ALERT_ID
    dimensions:
      - name: ALERT_TYPE
        description: "Alert type: Low Stock, Out of Stock, Overstock, Expiring Soon."
        expr: alert_type
        data_type: VARCHAR(30)
        access_modifier: public_access
    facts:
      - name: CURRENT_STOCK
        description: Current stock quantity on hand.
        expr: current_stock
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
  - name: PRODUCTS
    description: "Product master. PRODUCT_CATEGORY = Dairy, Bakery, Beverages, Cereals, Frozen, Household, Meat, Pantry, Produce. BRAND = supplier/brand."
    base_table:
      database: COLES_RETAIL_DB
      schema: AI_ANALYTICS
      table: V_PRODUCT_MASTER
    primary_key:
      columns:
        - MERCH_ID
    dimensions:
      - name: BRAND
        description: Brand or supplier name.
        expr: BRAND
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: CATEGORY
        description: "Product category: Dairy, Bakery, Beverages, Cereals, Frozen, Household, Meat, Pantry, Produce."
        expr: PRODUCT_CATEGORY
        data_type: VARCHAR(134217728)
        access_modifier: public_access
        is_enum: true
        sample_values:
          - Dairy
          - Bakery
          - Beverages
          - Cereals
          - Frozen
          - Household
          - Meat
          - Pantry
          - Produce
      - name: PRODUCT_NAME
        description: "Full product name, e.g. Full Cream Milk 2L."
        expr: ITEM_DESC
        data_type: VARCHAR(200)
        access_modifier: public_access
  - name: REVIEWS
    description: Customer reviews with 1-5 star ratings and free-text feedback. store_location has short names like Melbourne CBD.
    base_table:
      database: COLES_RETAIL_DB
      schema: MARKETING
      table: FACT_CUSTOMER_REVIEWS
    primary_key:
      columns:
        - REVIEW_ID
    dimensions:
      - name: PRODUCT_CATEGORY
        description: Product category of the reviewed item.
        expr: product_category
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: REVIEW_PERIOD
        description: Review month YYYY-MM.
        expr: "TO_CHAR(review_date, 'YYYY-MM')"
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: REVIEW_TEXT
        description: Free-text customer review content.
        expr: review_text
        data_type: VARCHAR(2000)
        access_modifier: public_access
      - name: STORE_LOCATION
        description: "Short store name in reviews, e.g. Melbourne CBD (no Coles prefix)."
        expr: store_location
        data_type: VARCHAR(50)
        access_modifier: public_access
    facts:
      - name: RATING
        description: Customer review rating 1-5 stars.
        expr: rating
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: AVG_RATING
        description: Average review rating 1-5.
        expr: AVG(reviews.rating)
        access_modifier: public_access
      - name: REVIEW_COUNT
        description: Total number of reviews.
        expr: COUNT(reviews.REVIEW_ID)
        access_modifier: public_access
  - name: REVIEW_SENTIMENT
    description: "AI sentiment per review aspect (product_quality, value, freshness, service, store_cleanliness, parking). Values: positive, negative, neutral, mixed, unknown."
    base_table:
      database: COLES_RETAIL_DB
      schema: MARKETING
      table: REVIEWS_SENTIMENT_CATEGORIES
    primary_key:
      columns:
        - REVIEW_ID
        - SENTIMENT_CATEGORY
    dimensions:
      - name: REVIEW_MONTH
        description: Sentiment review month YYYY-MM.
        expr: "TO_CHAR(review_sentiment.REVIEW_DATE, 'YYYY-MM')"
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: SENTIMENT
        description: "Sentiment: positive, negative, neutral, mixed, unknown."
        expr: sentiment
        data_type: VARCHAR(134217728)
        access_modifier: public_access
        is_enum: true
        sample_values:
          - positive
          - negative
          - neutral
          - mixed
          - unknown
      - name: SENTIMENT_CATEGORY
        description: "Aspect: product_quality, value, freshness, service, store_cleanliness, parking."
        expr: sentiment_category
        data_type: VARCHAR(134217728)
        access_modifier: public_access
        is_enum: true
        sample_values:
          - product_quality
          - value
          - freshness
          - service
          - store_cleanliness
          - parking
    metrics:
      - name: MIXED_COUNT
        description: Mixed sentiment count.
        expr: COUNT(CASE WHEN review_sentiment.sentiment = 'mixed' THEN 1 END)
        access_modifier: public_access
      - name: NEGATIVE_COUNT
        description: Negative sentiment count.
        expr: COUNT(CASE WHEN review_sentiment.sentiment = 'negative' THEN 1 END)
        access_modifier: public_access
      - name: NEUTRAL_COUNT
        description: Neutral sentiment count.
        expr: COUNT(CASE WHEN review_sentiment.sentiment = 'neutral' THEN 1 END)
        access_modifier: public_access
      - name: POSITIVE_COUNT
        description: Positive sentiment count.
        expr: COUNT(CASE WHEN review_sentiment.sentiment = 'positive' THEN 1 END)
        access_modifier: public_access
      - name: SENTIMENT_COUNT
        description: Total sentiment entries.
        expr: COUNT(review_sentiment.REVIEW_ID)
        access_modifier: public_access
  - name: SALES
    description: Sales transactions. NET_AMT is AFTER discounts — do NOT subtract DISC_AMT. MARGIN_AMT is gross profit.
    base_table:
      database: COLES_RETAIL_DB
      schema: RETAIL
      table: FACT_SALES_TRANSACTIONS
    primary_key:
      columns:
        - TXN_ID
    dimensions:
      - name: CUSTOMER_SEGMENT
        description: Customer segment.
        expr: SEG_CDE
        data_type: VARCHAR(50)
        access_modifier: public_access
        is_enum: true
        sample_values:
          - Budget
          - Convenience
          - Families
          - Health Conscious
          - Premium
          - Regular
      - name: PAYMENT_METHOD
        description: Payment method.
        expr: TENDER_CDE
        data_type: VARCHAR(20)
        access_modifier: public_access
        is_enum: true
        sample_values:
          - Card
          - Cash
          - Mobile
      - name: SALE_PERIOD
        description: Sales month YYYY-MM for monthly trends.
        expr: "TO_CHAR(INV_DT, 'YYYY-MM')"
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: TRANSACTION_DATE
        description: Date of the sales transaction.
        expr: INV_DT
        data_type: DATE
        access_modifier: public_access
    facts:
      - name: DISCOUNT_AMOUNT
        description: "Discount already applied to NET_AMT. Breakdown field, not additional deduction."
        expr: DISC_AMT
        data_type: "NUMBER(10,2)"
        access_modifier: public_access
      - name: GROSS_PROFIT
        description: Gross profit margin (revenue minus COGS).
        expr: MARGIN_AMT
        data_type: "NUMBER(10,2)"
        access_modifier: public_access
      - name: QUANTITY
        description: Units sold in the transaction.
        expr: UNIT_CNT
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: TOTAL_SALES
        description: Net sales after discounts. Do NOT subtract DISC_AMT.
        expr: NET_AMT
        data_type: "NUMBER(10,2)"
        access_modifier: public_access
    metrics:
      - name: REVENUE
        description: Total net revenue after discounts.
        expr: SUM(sales.total_sales)
        access_modifier: public_access
      - name: TOTAL_PROFIT
        description: Total gross profit.
        expr: SUM(sales.gross_profit)
        access_modifier: public_access
      - name: UNITS_SOLD
        description: Total units sold.
        expr: SUM(sales.quantity)
        access_modifier: public_access
  - name: STORES
    description: "Store dimension with 10 Coles locations. LOC_NM = full store name (e.g. Coles Melbourne CBD). FMT_CDE = format: Metro, Mall, Suburban."
    base_table:
      database: COLES_RETAIL_DB
      schema: AI_ANALYTICS
      table: V_STORES
    primary_key:
      columns:
        - LOC_ID
    dimensions:
      - name: CITY_NAME
        description: City of the store.
        expr: CITY_NM
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: STATE
        description: "Australian state: VIC, NSW, QLD, WA, SA, TAS."
        expr: ST_CDE
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: STORE_NAME
        description: "Full store name, e.g. Coles Melbourne CBD."
        expr: LOC_NM
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: STORE_TYPE
        description: "Store format: Metro, Mall, or Suburban."
        expr: FMT_CDE
        data_type: VARCHAR(50)
        access_modifier: public_access
        is_enum: true
        sample_values:
          - Metro
          - Mall
          - Suburban
  - name: STORE_PERFORMANCE
    description: "Daily store performance: revenue, transactions, basket size, foot traffic, conversion rate."
    base_table:
      database: COLES_RETAIL_DB
      schema: RETAIL
      table: FACT_DAILY_STORE_PERFORMANCE
    primary_key:
      columns:
        - PERFORMANCE_ID
    facts:
      - name: FOOT_TRAFFIC
        description: Customer visit count for a store on a given day.
        expr: foot_traffic
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: TOTAL_REVENUE
        description: Total daily revenue for a store.
        expr: total_revenue
        data_type: "NUMBER(12,2)"
        access_modifier: public_access
      - name: TOTAL_TRANSACTIONS
        description: Total transactions at a store on a given day.
        expr: total_transactions
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: TOTAL_VISITORS
        description: Total foot traffic.
        expr: SUM(store_performance.foot_traffic)
        access_modifier: public_access
  - name: SUPPLIERS
    description: "Supplier dimension with vendor details, country, reliability scores, and organic certification."
    base_table:
      database: COLES_RETAIL_DB
      schema: SUPPLY_CHAIN
      table: DIM_SUPPLIERS
    primary_key:
      columns:
        - SUPPLIER_ID
    dimensions:
      - name: COUNTRY
        description: Supplier country of origin.
        expr: country
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: SUPPLIER_NAME
        description: Supplier company name.
        expr: supplier_name
        data_type: VARCHAR(200)
        access_modifier: public_access
  - name: SUPPORT_TICKETS
    description: "Support tickets with AI-classified categories. Priority: CRITICAL, HIGH, MEDIUM, LOW."
    base_table:
      database: COLES_RETAIL_DB
      schema: MARKETING
      table: FACT_SUPPORT_TICKETS
    primary_key:
      columns:
        - TICKET_ID
    dimensions:
      - name: AI_CATEGORY
        description: AI-classified complaint category.
        expr: ai_category
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: PRIORITY
        description: "Ticket priority: CRITICAL, HIGH, MEDIUM, LOW."
        expr: priority
        data_type: VARCHAR(20)
        access_modifier: public_access
        is_enum: true
        sample_values:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
      - name: TICKET_STATUS
        description: "Ticket status: Open, In Progress, Resolved, Closed."
        expr: '"STATUS"'
        data_type: VARCHAR(20)
        access_modifier: public_access
  - name: TIME_DIM
    description: "Calendar dimension with daily grain, 5 years (2023-2027). Use for date filtering, fiscal periods, and seasonal trends."
    base_table:
      database: COLES_RETAIL_DB
      schema: CORE
      table: DIM_TIME
    primary_key:
      columns:
        - DATE_KEY
    dimensions:
      - name: DATE_KEY
        description: Calendar date.
        expr: date_key
        data_type: DATE
        access_modifier: public_access
      - name: DAY_NAME
        description: "Day name: Monday, Tuesday, etc."
        expr: day_name
        data_type: VARCHAR(10)
        access_modifier: public_access
      - name: FISCAL_QUARTER
        description: Coles fiscal quarter 1-4.
        expr: fiscal_quarter
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: FISCAL_YEAR
        description: Coles fiscal year (starts July 1).
        expr: fiscal_year
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: IS_BUSINESS_DAY
        description: TRUE if weekday and not a holiday.
        expr: is_business_day
        data_type: BOOLEAN
        access_modifier: public_access
      - name: IS_HOLIDAY
        description: TRUE if Australian public holiday.
        expr: is_holiday
        data_type: BOOLEAN
        access_modifier: public_access
      - name: IS_WEEKEND
        description: TRUE if Saturday or Sunday.
        expr: is_weekend
        data_type: BOOLEAN
        access_modifier: public_access
      - name: MONTH_NAME
        description: "Abbreviated month: Jan, Feb, Mar, etc."
        expr: month_name
        data_type: VARCHAR(10)
        access_modifier: public_access
      - name: QUARTER_NAME
        description: "Quarter: Q1, Q2, Q3, Q4."
        expr: quarter_name
        data_type: VARCHAR(6)
        access_modifier: public_access
      - name: SEASON
        description: "Southern hemisphere: Summer, Autumn, Winter, Spring."
        expr: season
        data_type: VARCHAR(10)
        access_modifier: public_access
      - name: WEEK_OF_YEAR
        description: ISO week number 1-52.
        expr: week_of_year
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: YEAR_MONTH
        description: "Period code P[YYYY][MM]. Use sale_period for user-facing month grouping."
        expr: PRD_CDE
        data_type: VARCHAR(7)
        access_modifier: public_access
      - name: YEAR_NUMBER
        description: Four-digit calendar year.
        expr: year_number
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: YEAR_QUARTER
        description: "Year-quarter, e.g. 2026-Q1."
        expr: year_quarter
        data_type: VARCHAR(7)
        access_modifier: public_access
