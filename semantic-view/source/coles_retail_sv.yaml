      database: COLES_RETAIL_DB
      schema: SUPPLY_CHAIN
      table: FACT_INVENTORY_ALERTS
    primary_key:
      columns:
        - ALERT_ID
    dimensions:
      - name: ALERT_TYPE
        expr: alert_type
        data_type: VARCHAR(30)
        access_modifier: public_access
    facts:
      - name: CURRENT_STOCK
        synonyms:
          - stock level
          - inventory
        expr: current_stock
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
  - name: PRODUCTS
    synonyms:
