        synonyms:
          - product category
          - department
        expr: PRODUCT_CATEGORY
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: PRODUCT_NAME
        synonyms:
          - product
          - item
        expr: ITEM_DESC
        data_type: VARCHAR(200)
