    facts:
      - name: RATING
        synonyms:
          - star rating
          - score
        expr: rating
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: AVG_RATING
        synonyms:
          - average rating
        expr: AVG(reviews.rating)
        access_modifier: public_access
      - name: REVIEW_COUNT
        synonyms:
          - number of reviews
        expr: COUNT(reviews.REVIEW_ID)
        access_modifier: public_access
  - name: REVIEW_SENTIMENT
    synonyms:
      - sentiment
      - customer sentiment
      - review sentiment
    base_table:
      database: COLES_RETAIL_DB
      schema: MARKETING
      table: REVIEWS_SENTIMENT_CATEGORIES
    primary_key:
      columns:
        - REVIEW_ID
        - SENTIMENT_CATEGORY
    dimensions:
      - name: REVIEW_MONTH
        synonyms:
          - sentiment month
        expr: "TO_CHAR(review_sentiment.REVIEW_DATE, 'YYYY-MM')"
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: SENTIMENT
        synonyms:
