      - ratings
    base_table:
      database: COLES_RETAIL_DB
      schema: MARKETING
      table: FACT_CUSTOMER_REVIEWS
    primary_key:
      columns:
        - REVIEW_ID
    dimensions:
      - name: PRODUCT_CATEGORY
        synonyms:
          - reviewed category
        expr: product_category
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: REVIEW_PERIOD
        synonyms:
          - review month
          - review period
        expr: "TO_CHAR(review_date, 'YYYY-MM')"
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: REVIEW_TEXT
        synonyms:
          - feedback text
          - customer feedback
          - review comment
