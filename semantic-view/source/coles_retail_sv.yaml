module_custom_instructions:
  sql_generation: |2

    IMPORTANT - Revenue Definitions:
    - "sales", "revenue", "net sales", "total sales" - always use the revenue metric which maps to SUM(total_sales) i.e. SUM(NET_AMT)
    - NET_AMT is the final net amount AFTER all discounts are applied. Do NOT subtract DISC_AMT from NET_AMT.
    - DISC_AMT is a breakdown field showing how much discount was included in computing NET_AMT. It is NOT an additional deduction.
    - For gross revenue before discounts, use SUM(NET_AMT + DISC_AMT)
    - NEVER generate SUM(NET_AMT - DISC_AMT) - this double-counts the discount deduction and produces incorrect results.

    IMPORTANT - Store Naming Convention:
    - Sales data uses: stores.store_name / LOC_NM (e.g., "Coles Melbourne CBD")
    - Review data uses: reviews.store_location (e.g., "Melbourne CBD")
    - When user asks about "Melbourne CBD" for reviews/sentiment, use store_location dimension
    - When user asks about "Coles Melbourne CBD" or sales, use store_name dimension
    - To join sales with reviews by location, match on LOC_ID / STORE_ID

    When asked about monthly sales trends or sales by month:
    - Always use sale_period dimension (format YYYY-MM) for grouping
    - Always include both revenue metric AND total_transactions metric
    - Order by sale_period ascending for chronological display

    When asked about dairy sales or dairy trends:
    - Filter by category = 'Dairy'
    - Include total_transactions to show volume alongside revenue

    When asked about sales by store:
    - Use store_name dimension from stores table
    - Include total_transactions metric

    When asked about sentiment or customer feedback:
    - Use review_sentiment table for sentiment analysis
    - sentiment_category dimension includes: product_quality, value, freshness, service, store_cleanliness, parking
    - sentiment dimension includes: positive, negative, neutral, mixed, unknown
    - Use positive_count, negative_count, neutral_count metrics for counts
    - Always show sentiment breakdown by sentiment_category (aspect) for detailed insights
    - Include review_text dimension to show the actual customer feedback

    When asked about negative sentiment or problems:
    - Filter by sentiment = 'negative'
    - Group by sentiment_category to identify problem areas
    - Include product_name, store_name, review_text for drill-down

    When asked about sentiment trends over time:
    - Use review_month dimension for time-based grouping
    - Show positive_count and negative_count to track changes
    - Order by review_month ascending

    VERIFIED QUERY EXAMPLES:

    Q: "Show me monthly sales trend for the last 6 months"
    A: SELECT sale_period, month_name, revenue, units_sold FROM sales WHERE transaction_date >= DATEADD(month, -6, CURRENT_DATE()) ORDER BY sale_period

    Q: "Which stores have the highest sales?"
    A: SELECT store_name, city_name, state, revenue, units_sold, total_profit FROM sales JOIN stores ON sales.LOC_ID = stores.LOC_ID WHERE transaction_date >= DATEADD(month, -3, CURRENT_DATE()) GROUP BY store_name, city_name, state ORDER BY revenue DESC LIMIT 10

    Q: "What are the best selling products?"
    A: SELECT product_name, category, revenue, units_sold FROM sales JOIN products ON sales.MERCH_ID = products.MERCH_ID WHERE transaction_date >= DATEADD(month, -1, CURRENT_DATE()) GROUP BY product_name, category ORDER BY revenue DESC LIMIT 10

    Q: "What are dairy sales by store for the last 3 months?"
    A: SELECT store_name, sale_period, revenue, units_sold FROM sales JOIN stores ON sales.LOC_ID = stores.LOC_ID JOIN products ON sales.MERCH_ID = products.MERCH_ID WHERE category = 'Dairy' AND transaction_date >= DATEADD(month, -3, CURRENT_DATE()) GROUP BY store_name, sale_period ORDER BY store_name, sale_period

    Q: "What is the sentiment breakdown for dairy products?"
    A: SELECT sentiment_category, positive_count, negative_count, neutral_count FROM review_sentiment WHERE product_category = 'Dairy' GROUP BY sentiment_category ORDER BY negative_count DESC

    Q: "Which stores have the most negative reviews?"
    A: SELECT store_location, product_category, negative_count FROM review_sentiment WHERE sentiment = 'negative' GROUP BY store_location, product_category ORDER BY negative_count DESC LIMIT 10

    Q: "Compare sales across customer segments"
    A: SELECT customer_segment, revenue, units_sold FROM sales WHERE transaction_date >= DATEADD(month, -3, CURRENT_DATE()) GROUP BY customer_segment ORDER BY revenue DESC

    Q: "Compare Metro vs Regional store performance"
    A: SELECT store_type, state, revenue, units_sold, total_profit FROM sales JOIN stores ON sales.LOC_ID = stores.LOC_ID WHERE transaction_date >= DATEADD(month, -3, CURRENT_DATE()) GROUP BY store_type, state ORDER BY revenue DESC
