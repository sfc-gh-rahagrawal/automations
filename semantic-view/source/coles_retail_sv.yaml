        - DATE_KEY
    dimensions:
      - name: DATE_KEY
        synonyms:
          - date
          - day
        expr: DATE_KEY
        data_type: DATE
        access_modifier: public_access
      - name: MONTH_NAME
        synonyms:
          - month
        expr: MONTH_NAME
        data_type: VARCHAR(10)
        access_modifier: public_access
      - name: QUARTER_NAME
        synonyms:
          - quarter
        expr: QUARTER_NAME
        data_type: VARCHAR(6)
        access_modifier: public_access
      - name: WEEK_OF_YEAR
        synonyms:
          - week number
          - week
        expr: WEEK_OF_YEAR
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: YEAR_MONTH
        synonyms:
          - month year
          - period
          - year month
        expr: YEAR_MONTH
        data_type: VARCHAR(15)
        access_modifier: public_access
      - name: YEAR_NUMBER
        synonyms:
          - year
        expr: YEAR_NUMBER
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
metrics:
  - name: NET_PROMOTER_IMPACT
    synonyms:
      - NPS proxy
      - net sentiment
      - sentiment balance
    description: "DAX equivalent: Net Sentiment = [Positive Count] - [Negative Count]"
    expr: review_sentiment.positive_count - review_sentiment.negative_count
    access_modifier: public_access
  - name: PROFIT_PER_UNIT
    synonyms:
      - profit per unit
      - unit margin
      - PPU
    description: "DAX equivalent: PPU = DIVIDE([Total Profit], [Total Units])"
    expr: "sales.total_profit / NULLIF(sales.units_sold, 0)"
    access_modifier: public_access
  - name: PROMO_EFFECTIVENESS
    synonyms:
      - ROI on promotions
      - promo ROI
      - promotion effectiveness
    description: "DAX equivalent: Promo ROI = DIVIDE([Total Profit], [Total Markdowns])"
    expr: "sales.total_profit / NULLIF(sales.total_discount, 0)"
    access_modifier: public_access
  - name: SALES_DENSITY
    synonyms:
      - sales density
      - revenue per footfall
      - yield per visitor
    description: "DAX equivalent: Sales Density = DIVIDE([Revenue], [Total Visitors])"
    expr: "sales.revenue / NULLIF(store_performance.total_visitors, 0)"
    access_modifier: public_access
