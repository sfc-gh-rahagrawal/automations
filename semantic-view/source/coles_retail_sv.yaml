name: COLES_RETAIL_SEMANTIC_MODEL
description: Coles Retail semantic view with sentiment analysis for Cortex Analyst
tables:
  - name: INVENTORY_ALERTS
    base_table:
      database: COLES_RETAIL_DB
      schema: SUPPLY_CHAIN
      table: FACT_INVENTORY_ALERTS
    primary_key:
      columns:
        - ALERT_ID
    dimensions:
      - name: ALERT_TYPE
        expr: ALERT_TYPE
        data_type: VARCHAR(30)
        access_modifier: public_access
    facts:
      - name: CURRENT_STOCK
        synonyms:
          - stock level
          - inventory
        expr: CURRENT_STOCK
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
  - name: PRODUCTS
    synonyms:
      - product
      - item
    base_table:
      database: COLES_RETAIL_DB
      schema: AI_ANALYTICS
      table: V_PRODUCT_MASTER
    primary_key:
      columns:
        - MERCH_ID
    dimensions:
      - name: BRAND
        synonyms:
          - brand
        expr: BRAND
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: ITEM_DESC
        synonyms:
          - product name
          - product
          - item
        expr: ITEM_DESC
        data_type: VARCHAR(200)
        access_modifier: public_access
      - name: PRODUCT_CATEGORY
        synonyms:
          - category
          - product category
          - department
        expr: PRODUCT_CATEGORY
        data_type: VARCHAR(134217728)
        access_modifier: public_access
  - name: REVIEWS
    synonyms:
      - feedback
      - ratings
    base_table:
      database: COLES_RETAIL_DB
      schema: RETAIL
      table: FACT_CUSTOMER_REVIEWS
    primary_key:
      columns:
        - REVIEW_ID
    dimensions:
      - name: PRODUCT_CATEGORY
        synonyms:
          - reviewed category
        expr: PRODUCT_CATEGORY
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: REVIEW_TEXT
        synonyms:
          - feedback text
          - customer feedback
          - review comment
        expr: REVIEW_TEXT
        data_type: VARCHAR(2000)
        access_modifier: public_access
      - name: STORE_LOCATION
        synonyms:
          - review location
          - review store location
        expr: STORE_LOCATION
        data_type: VARCHAR(50)
        access_modifier: public_access
    facts:
      - name: RATING
        synonyms:
          - star rating
          - score
        expr: RATING
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: AVG_RATING
        synonyms:
          - average rating
          - customer score
        expr: AVG(reviews.rating)
        access_modifier: public_access
      - name: REVIEW_COUNT
        synonyms:
          - number of reviews
        expr: COUNT(reviews.REVIEW_ID)
        access_modifier: public_access
  - name: REVIEW_SENTIMENT
    synonyms:
      - sentiment
      - customer sentiment
      - review sentiment
    base_table:
      database: COLES_RETAIL_DB
      schema: RETAIL
      table: REVIEWS_SENTIMENT_CATEGORIES
    primary_key:
      columns:
        - REVIEW_ID
        - SENTIMENT_CATEGORY
    dimensions:
      - name: SENTIMENT
        synonyms:
          - sentiment type
          - sentiment value
        expr: SENTIMENT
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: SENTIMENT_CATEGORY
        synonyms:
          - aspect
          - sentiment aspect
        expr: SENTIMENT_CATEGORY
        data_type: VARCHAR(134217728)
        access_modifier: public_access
    metrics:
      - name: MIXED_COUNT
        synonyms:
          - mixed reviews
        expr: COUNT(CASE WHEN review_sentiment.SENTIMENT = 'mixed' THEN 1 END)
        access_modifier: public_access
      - name: NEGATIVE_COUNT
        synonyms:
          - negative reviews
          - negative sentiment count
        expr: COUNT(CASE WHEN review_sentiment.SENTIMENT = 'negative' THEN 1 END)
        access_modifier: public_access
      - name: NEUTRAL_COUNT
        synonyms:
          - neutral reviews
        expr: COUNT(CASE WHEN review_sentiment.SENTIMENT = 'neutral' THEN 1 END)
        access_modifier: public_access
      - name: POSITIVE_COUNT
        synonyms:
          - positive reviews
          - positive sentiment count
        expr: COUNT(CASE WHEN review_sentiment.SENTIMENT = 'positive' THEN 1 END)
        access_modifier: public_access
      - name: SENTIMENT_COUNT
        synonyms:
          - total sentiment reviews
        expr: COUNT(review_sentiment.REVIEW_ID)
        access_modifier: public_access
  - name: SALES
    synonyms:
      - transactions
      - orders
    base_table:
      database: COLES_RETAIL_DB
      schema: AI_ANALYTICS
      table: V_SALES_ENRICHED
    primary_key:
      columns:
        - TXN_ID
    dimensions:
      - name: CHANNEL
        synonyms:
          - online vs in-store
        expr: CHANNEL
        data_type: VARCHAR(8)
        access_modifier: public_access
      - name: CUSTOMER_SEGMENT
        synonyms:
          - customer type
          - customer segment
        expr: CUSTOMER_SEGMENT
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: FULFILMENT_TYPE
        synonyms:
          - fulfilment
          - delivery type
        expr: FULFILMENT_TYPE
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: INV_DT
        synonyms:
          - transaction date
          - sale date
        expr: INV_DT
        data_type: DATE
        access_modifier: public_access
      - name: TENDER_CDE
        synonyms:
          - payment method
        expr: TENDER_CDE
        data_type: VARCHAR(20)
        access_modifier: public_access
    facts:
      - name: BASE_PRICE
        synonyms:
          - list price
          - shelf price
        expr: BASE_PRC
        data_type: "NUMBER(10,2)"
        access_modifier: public_access
      - name: DISCOUNT_AMOUNT
        synonyms:
          - discount
        expr: DISC_AMT
        data_type: "NUMBER(10,2)"
        access_modifier: public_access
      - name: GROSS_PROFIT
        synonyms:
          - profit
        expr: MARGIN_AMT
        data_type: "NUMBER(10,2)"
        access_modifier: public_access
      - name: QUANTITY
        synonyms:
          - units sold
          - qty
        expr: UNIT_CNT
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: TOTAL_SALES
        synonyms:
          - revenue
          - sales amount
        expr: NET_AMT
        data_type: "NUMBER(10,2)"
        access_modifier: public_access
    metrics:
      - name: AVG_SELLING_PRICE
        synonyms:
          - ASP
          - average price per unit
          - unit price
        description: "DAX equivalent: ASP = DIVIDE(SUM(Sales[NET_AMT]), SUM(Sales[UNIT_CNT]))"
        expr: "SUM(sales.total_sales) / NULLIF(SUM(sales.quantity), 0)"
        access_modifier: public_access
      - name: GROSS_MARGIN_PCT
        synonyms:
          - gross margin
          - margin percent
          - GM%
        description: "DAX equivalent: GM% = DIVIDE(SUM(Sales[MARGIN_AMT]), SUM(Sales[NET_AMT])) * 100"
        expr: "SUM(sales.gross_profit) / NULLIF(SUM(sales.total_sales), 0) * 100"
        access_modifier: public_access
      - name: MARKDOWN_RATE
        synonyms:
          - discount rate
          - promo intensity
          - markdown %
        description: "DAX equivalent: Markdown% = DIVIDE(SUM(DISC_AMT), SUM(NET_AMT)+SUM(DISC_AMT)) * 100"
        expr: "SUM(sales.discount_amount) / NULLIF(SUM(sales.total_sales) + SUM(sales.discount_amount), 0) * 100"
        access_modifier: public_access
      - name: REVENUE
        synonyms:
          - total revenue
          - net sales
        description: "DAX equivalent: Total Revenue = SUM(Sales[NET_AMT])"
        expr: SUM(sales.total_sales)
        access_modifier: public_access
      - name: TOTAL_DISCOUNT
        synonyms:
          - total markdowns
          - promo spend
        description: "DAX equivalent: Total Discount = SUM(Sales[DISC_AMT])"
        expr: SUM(sales.discount_amount)
        access_modifier: public_access
      - name: TOTAL_PROFIT
        synonyms:
          - gross profit
          - margin dollars
        description: "DAX equivalent: Total Profit = SUM(Sales[MARGIN_AMT])"
        expr: SUM(sales.gross_profit)
        access_modifier: public_access
      - name: UNITS_SOLD
        synonyms:
          - total units
          - volume
        description: "DAX equivalent: Total Units = SUM(Sales[UNIT_CNT])"
        expr: SUM(sales.quantity)
        access_modifier: public_access
  - name: STORES
    synonyms:
      - store
      - location
      - branch
    base_table:
      database: COLES_RETAIL_DB
      schema: AI_ANALYTICS
      table: V_STORES
    primary_key:
      columns:
        - LOC_ID
    dimensions:
      - name: CITY_NM
        synonyms:
          - city
        expr: CITY_NM
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: FMT_CDE
        synonyms:
          - store type
          - format
        expr: FMT_CDE
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: LOC_NM
        synonyms:
          - store name
          - store
          - location
        expr: LOC_NM
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: ST_CDE
        synonyms:
          - state
          - region
        expr: ST_CDE
        data_type: VARCHAR(50)
        access_modifier: public_access
  - name: STORE_PERFORMANCE
    base_table:
      database: COLES_RETAIL_DB
      schema: RETAIL
      table: FACT_DAILY_STORE_PERFORMANCE
    primary_key:
      columns:
        - PERFORMANCE_ID
    facts:
      - name: FOOT_TRAFFIC
        synonyms:
          - visitors
          - traffic
        expr: FOOT_TRAFFIC
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: TOTAL_REVENUE
        synonyms:
          - daily sales
          - store revenue
        expr: TOTAL_REVENUE
        data_type: "NUMBER(12,2)"
        access_modifier: public_access
      - name: TOTAL_TRANSACTIONS
        synonyms:
          - transaction count
        expr: TOTAL_TRANSACTIONS
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: AVG_TRANSACTION_VALUE
        synonyms:
          - ATV
          - basket size
          - average basket
        description: "DAX equivalent: ATV = DIVIDE(Revenue, Transactions)"
        expr: "SUM(store_performance.total_revenue) / NULLIF(SUM(store_performance.total_transactions), 0)"
        access_modifier: public_access
      - name: CONVERSION_RATE
        synonyms:
          - conversion rate
          - conversion %
          - shoppers to buyers
        description: "DAX equivalent: Conversion% = DIVIDE(Transactions, FootTraffic) * 100"
        expr: "SUM(store_performance.total_transactions) / NULLIF(SUM(store_performance.foot_traffic), 0) * 100"
        access_modifier: public_access
      - name: REVENUE_PER_VISITOR
        synonyms:
          - sales per visitor
          - RPV
          - spend per head
        description: "DAX equivalent: RPV = DIVIDE(Revenue, FootTraffic)"
        expr: "SUM(store_performance.total_revenue) / NULLIF(SUM(store_performance.foot_traffic), 0)"
        access_modifier: public_access
      - name: TOTAL_VISITORS
        synonyms:
          - visitors
          - footfall
        expr: SUM(store_performance.foot_traffic)
        access_modifier: public_access
  - name: SUPPLIERS
    synonyms:
